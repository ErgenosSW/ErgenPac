name: Release package

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  tests:
    name: Regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gir1.2-adw-1 gir1.2-gtk-4.0 python3-gi
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-([1-9][0-9]*))?$ ]]
          version="${BASH_REMATCH[1]}"
          code_version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$version" = "$code_version"
      - name: Check Python syntax
        run: python3 -m compileall -q src tests
      - name: Run regression suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -v

  package:
    name: Build unsigned Arch package
    needs: tests
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm git pacman-contrib sudo
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Configure signed ErgenOS repository
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/ErgenosSW/ErgenOS-Repo/main/keys/ergenos.asc \
            --output /tmp/ergenos.asc
          fingerprint=$(gpg --batch --show-keys --with-colons /tmp/ergenos.asc | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$fingerprint" = 28F9539131BC392DAF4099C595FE7988F432AFDA
          pacman-key --init
          pacman-key --add /tmp/ergenos.asc
          pacman-key --lsign-key "$fingerprint"
          printf '\n[ergenos]\nSigLevel = Required\nServer = https://ergenossw.github.io/ErgenOS-Repo/$arch\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm
      - name: Create build user
        run: |
          useradd -m builder
          printf 'builder ALL=(ALL:ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Prepare tagged package recipe
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-([1-9][0-9]*))?$ ]]
          version="${BASH_REMATCH[1]}"
          revision="${BASH_REMATCH[3]:-1}"
          sed -i "s/^pkgver=.*/pkgver=$version/; s/^pkgrel=.*/pkgrel=$revision/" PKGBUILD
          # Build this checkout, including changes made after the version-only tag.
          sudo -u builder git archive --format=tar.gz --prefix="ErgenPac-${version}/" \
            --output="ergenpac-${version}.tar.gz" HEAD
          sed -i 's|^source=.*|source=("ergenpac-${pkgver}.tar.gz")|' PKGBUILD
          chown builder:builder "ergenpac-${version}.tar.gz"
          sudo -u builder updpkgsums
      - name: Build unsigned package
        run: sudo -u builder makepkg --syncdeps --noconfirm --needed --nocheck
      - name: Inspect package
        shell: bash
        run: |
          package=$(find . -maxdepth 1 -type f -name '*.pkg.tar.zst' ! -name '*-debug-*' -print -quit)
          test -n "$package"
          pacman -Qip "$package"
          mkdir -p artifacts
          cp "$package" artifacts/
      - uses: actions/upload-artifact@v6
        with:
          name: ergenpac-${{ env.RELEASE_TAG }}-arch-package
          path: artifacts/*.pkg.tar.zst
          if-no-files-found: error
